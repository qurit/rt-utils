[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-utils"
description = "A small library for handling masks and RT-Structs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Asim Shrestha", email = "asim.shrestha@hotmail.com" },
]
keywords = ["RTStruct", "Dicom", "Pydicom"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]
dependencies = [
    "pydicom",
    "numpy",
    "opencv-python-headless>=4.0.0",
    "scipy",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/qurit/rt-utils"
Repository = "https://github.com/qurit/rt-utils"
Issues = "https://github.com/qurit/rt-utils/issues"

[project.optional-dependencies]
# Extras for rt_utils.nifti, which is not imported by `rt_utils/__init__.py`.
nifti = ["SimpleITK"]
dev = [
    "pytest",
    "build",
    "twine",
    "black",
    # So the rt_utils.nifti tests run in CI rather than being skipped.
    "SimpleITK",
]

[tool.setuptools.dynamic]
version = { attr = "rt_utils._version.__version__" }

[tool.setuptools.packages.find]
include = ["rt_utils*"]
