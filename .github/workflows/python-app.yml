# Install dependencies and run the test suite across supported Python versions.
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Test with pytest
      run: |
        pytest

  opencv4:
    # The newest OpenCV tolerates degenerate (1- and 2-point) contours that
    # OpenCV 4.x rejects outright, so testing only the latest release hides a
    # whole class of bug from CI. pyproject declares opencv-python>=4.0.0, so
    # pin the 4.x line here and keep it covered.
    name: Tests on OpenCV 4.x
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies with OpenCV pinned to 4.x
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install "opencv-python~=4.10.0" "numpy<2"
    - name: Show resolved versions
      run: python -c "import cv2, numpy; print('cv2', cv2.__version__, '| numpy', numpy.__version__)"
    - name: Test with pytest
      run: |
        pytest
