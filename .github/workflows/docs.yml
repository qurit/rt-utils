# Build the documentation the way Read the Docs does, so a broken
# cross-reference or a page missing from a toctree fails the pull request
# rather than the published site.

name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - docs/**
      - rt_utils/**
      - .readthedocs.yaml
      - .github/workflows/docs.yml
  pull_request:
    branches: [ main ]
    paths:
      - docs/**
      - rt_utils/**
      - .readthedocs.yaml
      - .github/workflows/docs.yml

jobs:
  build:
    name: Build HTML
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        # The API reference is generated from docstrings, so rt_utils and its
        # runtime dependencies have to be importable.
        pip install .
    - name: Build with warnings as errors
      run: sphinx-build -b html -W --keep-going docs docs/_build/html
    - name: Upload the built site
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html
        retention-days: 14
